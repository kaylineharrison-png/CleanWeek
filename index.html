<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CleanWeek"><link rel="manifest" href="manifest.json">
<title>CleanWeek</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--text:#17171b;--muted:#777782;--accent:#6d5dfc;--line:#e9e9ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
header{padding:22px 4px 14px}h1{margin:0;font-size:31px}button{font:inherit;border:0;cursor:pointer}
.progress,.card{background:var(--card);border-radius:22px;box-shadow:0 3px 18px #0000000a}.progress{padding:18px;margin-bottom:14px}
.row{display:flex;justify-content:space-between}.pct{font-size:27px;font-weight:750}.bar{height:9px;background:#ececf2;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:var(--accent);transition:.25s}
.days{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.day{min-width:72px;background:var(--card);padding:10px 8px;border-radius:17px;text-align:center;border:2px solid transparent}.day.active{border-color:var(--accent)}.dow{font-size:12px;color:var(--muted)}.num{font-size:19px;font-weight:700;margin-top:3px}
.card{padding:8px 14px}.task{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:27px;height:27px;border-radius:50%;border:2px solid #c9c9d2;background:white;flex:none}.check.on{background:var(--accent);border-color:var(--accent);color:white}.done .name{text-decoration:line-through;color:var(--muted)}.name{font-weight:600}.meta{font-size:12px;color:var(--muted);margin-top:3px}.empty{text-align:center;padding:38px 15px;color:var(--muted)}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;background:var(--accent);color:white;font-size:30px;box-shadow:0 8px 24px #6d5dfc55}
dialog{border:0;border-radius:25px;width:min(92%,480px);padding:0;box-shadow:0 20px 60px #0004}dialog::backdrop{background:#0007}.modal{padding:22px}.modal h2{margin-top:0}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input:not([type=checkbox]),select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit;background:#fafafd}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1;padding:13px;border-radius:14px}.primary{background:var(--accent);color:white}.secondary{background:#eeeef3}.link{background:none;color:var(--accent);font-weight:650}
@media(prefers-color-scheme:dark){:root{--bg:#111116;--card:#1d1d23;--text:#f5f5f7;--muted:#a4a4ae;--line:#303038}.bar{background:#303038}.check{background:#1d1d23}}
</style></head><body>
<div class="app"><header><h1>CleanWeek</h1><div style="color:var(--muted);margin-top:3px">Your weekly cleaning plan</div></header>
<section class="progress"><div class="row"><strong>This week</strong><span class="pct" id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="count" style="font-size:13px;color:var(--muted);margin-top:8px"></div></section>
<div class="days" id="days"></div><section class="card" id="tasks"></section></div>
<button class="fab" onclick="openAdd()">+</button>
<dialog id="dlg"><form class="modal" onsubmit="saveTask(event)"><h2 id="title">Add cleaning task</h2>
<label>Task</label><input id="taskName" required placeholder="Vacuum living room">
<label>Room / area</label><input id="room" placeholder="Living room">
<label>Day</label><select id="day"></select>
<label><input id="recurring" type="checkbox"> Repeat every week</label>
<div class="actions"><button type="button" class="secondary" onclick="dlg.close()">Cancel</button><button class="primary">Save task</button></div></form></dialog>
<script>
const KEY="cleanweek-v1";let editing=null;
const names=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],short=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function weekStart(d=new Date()){let x=new Date(d),n=x.getDay();x.setDate(x.getDate()+(n===0?-6:1-n));x.setHours(0,0,0,0);return x.toISOString().slice(0,10)}
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{tasks:[],week:weekStart(),selected:1};
if(data.week!==weekStart()){data.week=weekStart();data.tasks.forEach(t=>t.done=false)}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let s=new Date(data.week+"T00:00:00");document.getElementById("days").innerHTML=names.map((n,i)=>{let d=new Date(s);d.setDate(s.getDate()+i);return `<button class="day ${data.selected===i+1?"active":""}" onclick="selectDay(${i+1})"><div class="dow">${short[i]}</div><div class="num">${d.getDate()}</div></button>`}).join("");
let ts=data.tasks.filter(t=>t.day===data.selected);document.getElementById("tasks").innerHTML=ts.length?ts.map(t=>`<div class="task ${t.done?"done":""}"><button class="check ${t.done?"on":""}" onclick="toggle('${t.id}')">${t.done?"✓":""}</button><div style="flex:1"><div class="name">${esc(t.name)}</div><div class="meta">${esc(t.room||"")}${t.recurring?" · Weekly":""}</div></div><button class="link" onclick="editTask('${t.id}')">Edit</button></div>`).join(""):`<div class="empty">Nothing scheduled for ${names[data.selected-1]}.<br>Add a cleaning task with +</div>`;
let total=data.tasks.length,done=data.tasks.filter(t=>t.done).length,p=total?Math.round(done/total*100):0;document.getElementById("pct").textContent=p+"%";document.getElementById("fill").style.width=p+"%";document.getElementById("count").textContent=`${done} of ${total} completed`;save()}
function selectDay(n){data.selected=n;render()} function toggle(id){let t=data.tasks.find(x=>x.id===id);if(t)t.done=!t.done;render()}
function fillDays(v){day.innerHTML=names.map((n,i)=>`<option value="${i+1}" ${v===i+1?"selected":""}>${n}</option>`).join("")}
function openAdd(){editing=null;title.textContent="Add cleaning task";taskName.value="";room.value="";fillDays(data.selected);recurring.checked=true;dlg.showModal()}
function editTask(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;editing=id;title.textContent="Edit cleaning task";taskName.value=t.name;room.value=t.room||"";fillDays(t.day);recurring.checked=!!t.recurring;dlg.showModal()}
function saveTask(e){e.preventDefault();let obj={id:editing||crypto.randomUUID(),name:taskName.value.trim(),room:room.value.trim(),day:+day.value,recurring:recurring.checked,done:editing?(data.tasks.find(t=>t.id===editing)?.done||false):false};if(editing)data.tasks[data.tasks.findIndex(t=>t.id===editing)]=obj;else data.tasks.push(obj);dlg.close();render()}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
